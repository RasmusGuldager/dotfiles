set-option -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.config/tmux/tmux.conf
bind m set -g mouse \; display-message "Mouse toggled"

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

set -g base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g set-titles on
set -g status-position top
set -g escape-time 0
setw -g mouse on
setw -g mode-keys vi

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Set plugins
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "fabioluciano/tmux-powerkit"
set -g @plugin "tmux-plugins/tmux-prefix-highlight"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"

set -g @continuum-restore "on"
set -g @resurrect-strategy-nvim "session"


# Powerkit customization
set -g @powerkit_theme "custom"
set -g @powerkit_custom_theme_path "~/.config/tmux/powerkit-theme.sh"


# Theme configuration
set -g @powerkit_separator_style "slant"
set -g @powerkit_edge_separator_style "same"

set -g @powerkit_elements_spacing "both"  # false, true, both, windows, plugins
set -g @powerkit_status_order "session,windows,plugins"
set -g @powerkit_transparent "true"

set -g @powerkit_status_interval 5
set -g @powerkit_battery_saver "off"


# Plugin configurations
set -g @powerkit_plugins "battery,datetime,wifi,netspeed,memory,cpu_precise"

# Battery plugin
set -g @powerkit_plugin_battery_icon "󰁹"
set -g @powerkit_plugin_battery_icon_charging "󰂄"
set -g @powerkit_plugin_battery_icon_warning "󰂃"

# Datetime plugin
set -g @powerkit_datetime_format "datetime"

# WiFi plugin
set -g @powerkit_plugin_wifi_format "signal,ssid"
set -g @powerkit_plugin_wifi_show_when "always"

# Netspeed plugin
set -g @powerkit_plugin_netspeed_warning_threshold 5000
set -g @powerkit_plugin_netspeed_critical_threshold 15000

# Memory plugin
set -g @powerkit_plugin_memory_format "usage"

# CPU plugin
set -g @powerkit_plugin_cpu_precise_cache_ttl 2
set -g @powerkit_plugin_cpu_precise_warning_threshold 10
set -g @powerkit_plugin_cpu_precise_critical_threshold 50


run "~/.tmux/plugins/tpm/tpm"
